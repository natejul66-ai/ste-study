<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Factoring Quiz | STE Study Hub</title>

  <style>
    :root {
      --background: #0f1117;
      --surface: #171a21;
      --surface-hover: #1c2029;
      --border: #282d38;
      --text: #f1f3f5;
      --muted: #969daa;
      --blue: #4d9fff;
      --blue-hover: #6aafff;
      --green: #4ade80;
      --red: #f87171;
      --yellow: #facc15;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--background);
      color: var(--text);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(15, 17, 23, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      max-width: 1000px;
      margin: auto;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      color: var(--text);
      text-decoration: none;
      font-size: 20px;
      font-weight: 700;
      white-space: nowrap;
    }

    .logo span {
      color: var(--blue);
    }

    nav {
      display: flex;
      gap: 20px;
    }

    nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
    }

    nav a:hover,
    nav a.active {
      color: var(--blue);
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 35px 20px 60px;
    }

    .back-link {
      display: inline-block;
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .back-link:hover {
      color: var(--blue);
    }

    .subject {
      color: var(--blue);
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 34px;
      margin: 0 0 25px;
    }

    .quiz-info {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .info-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 18px;
    }

    .info-label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 7px;
    }

    .info-value {
      font-size: 18px;
      font-weight: 700;
    }

    .quiz-progress {
      margin-bottom: 20px;
    }

    .progress-text {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 8px;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: var(--surface);
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--blue);
      transition: width 0.25s ease;
    }

    .quiz-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 25px;
    }

    .question-number {
      color: var(--blue);
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .question {
      font-size: 21px;
      line-height: 1.5;
      margin-bottom: 25px;
      font-weight: 600;
    }

    .options {
      display: grid;
      gap: 12px;
    }

    .option {
      width: 100%;
      padding: 15px;
      text-align: left;
      border: 1px solid var(--border);
      background: var(--background);
      color: var(--text);
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      transition: 0.2s;
    }

    .option:hover {
      background: var(--surface-hover);
      border-color: var(--blue);
    }

    .option.selected {
      border-color: var(--blue);
      background: rgba(77, 159, 255, 0.1);
    }

    .option.correct {
      border-color: var(--green);
      color: var(--green);
    }

    .option.incorrect {
      border-color: var(--red);
      color: var(--red);
    }

    .quiz-buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 25px;
      gap: 12px;
    }

    button {
      font-family: inherit;
    }

    .nav-btn {
      padding: 12px 20px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      font-size: 14px;
    }

    .nav-btn:hover {
      background: var(--surface-hover);
    }

    .nav-btn.primary {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
    }

    .nav-btn.primary:hover {
      background: var(--blue-hover);
    }

    .nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .result {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 30px;
      text-align: center;
    }

    .result h2 {
      margin-top: 0;
      font-size: 28px;
    }

    .score {
      font-size: 46px;
      font-weight: 700;
      color: var(--green);
      margin: 15px 0;
    }

    .result-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 25px 0;
    }

    .stat {
      background: var(--background);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 15px;
    }

    .stat-label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 700;
    }

    .review {
      display: none;
      margin-top: 25px;
      text-align: left;
    }

    .review h3 {
      margin-bottom: 15px;
    }

    .review-item {
      background: var(--background);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 12px;
    }

    .review-question {
      font-weight: 700;
      margin-bottom: 8px;
    }

    .review-answer {
      font-size: 14px;
      color: var(--muted);
    }

    .review-answer.correct {
      color: var(--green);
    }

    .review-answer.incorrect {
      color: var(--red);
    }

    .footer-note {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      margin-top: 35px;
    }

    @media (max-width: 700px) {
      .header-inner {
        flex-direction: column;
        align-items: flex-start;
      }

      nav {
        width: 100%;
        justify-content: space-between;
        gap: 8px;
      }

      .quiz-info,
      .result-stats {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <a href="index.html" class="logo">STE <span>Study Hub</span></a>

    <nav>
      <a href="index.html">Home</a>
      <a href="reviewer.html">Reviewers</a>
      <a href="quizzes.html" class="active">Quizzes</a>
      <a href="notes.html">Notes</a>
      <a href="progress.html">Progress</a>
    </nav>
  </div>
</header>

<div class="container">

  <a href="quizzes.html" class="back-link">← Back to Quizzes</a>

  <div class="subject">MATHEMATICS</div>
  <h1>Factoring</h1>

  <div class="quiz-info">
    <div class="info-card">
      <div class="info-label">Questions</div>
      <div class="info-value">5</div>
    </div>

    <div class="info-card">
      <div class="info-label">Difficulty</div>
      <div class="info-value">Easy</div>
    </div>

    <div class="info-card">
      <div class="info-label">Type</div>
      <div class="info-value">Logic</div>
    </div>
  </div>

  <div id="quizArea">

    <div class="quiz-progress">
      <div class="progress-text">
        <span id="progressText">Question 1 of 5</span>
        <span id="answeredText">0 / 5 Answered</span>
      </div>

      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <div class="quiz-card">
      <div class="question-number" id="questionNumber">
        Question 1
      </div>

      <div class="question" id="questionText"></div>

      <div class="options" id="options"></div>

      <div class="quiz-buttons">
        <button class="nav-btn" id="previousBtn">
          Previous
        </button>

        <button class="nav-btn primary" id="nextBtn">
          Next
        </button>
      </div>
    </div>

  </div>

  <div class="result" id="result">

    <h2>Quiz Complete!</h2>

    <div class="score" id="score">0/5</div>

    <div class="result-stats">

      <div class="stat">
        <div class="stat-label">Correct</div>
        <div class="stat-value" id="correctCount">0</div>
      </div>

      <div class="stat">
        <div class="stat-label">Incorrect</div>
        <div class="stat-value" id="incorrectCount">0</div>
      </div>

      <div class="stat">
        <div class="stat-label">Percentage</div>
        <div class="stat-value" id="percentage">0%</div>
      </div>

    </div>

    <button class="nav-btn primary" onclick="retakeQuiz()">
      Retake Quiz
    </button>

    <button class="nav-btn" onclick="toggleReview()">
      Answer Review
    </button>

    <div class="review" id="review">
      <h3>Answer Review</h3>
      <div id="reviewContent"></div>
    </div>

  </div>

  <div class="footer-note">
    Keep practicing 
  </div>

</div>

<script>
  const questions = [
    {
      question: "Factor completely: 6x + 12",
      options: [
        "6(x + 2)",
        "3(x + 4)",
        "2(3x + 12)",
        "6(x + 12)"
      ],
      answer: 0,
      method: "Factoring with a GCF"
    },

    {
      question: "Factor completely: x² − 25",
      options: [
        "(x − 5)(x + 5)",
        "(x − 25)(x + 1)",
        "(x − 5)²",
        "(x + 25)(x − 1)"
      ],
      answer: 0,
      method: "Difference of Two Squares"
    },

    {
      question: "Factor completely: x² + 7x + 12",
      options: [
        "(x + 2)(x + 6)",
        "(x + 3)(x + 4)",
        "(x − 3)(x − 4)",
        "(x + 1)(x + 12)"
      ],
      answer: 1,
      method: "Factoring Trinomials"
    },

    {
      question: "Factor completely: x² + 10x + 25",
      options: [
        "(x + 5)²",
        "(x − 5)²",
        "(x + 10)(x + 15)",
        "(x + 25)(x + 1)"
      ],
      answer: 0,
      method: "Perfect Square Trinomial"
    },

    {
      question: "Factor completely: 4x² − 36",
      options: [
        "4(x² − 9)",
        "4(x − 3)(x + 3)",
        "(2x − 6)(2x + 6)",
        "Both A and B"
      ],
      answer: 3,
      method: "GCF + Difference of Two Squares"
    }
  ];

  let currentQuestion = 0;
  let answers = new Array(questions.length).fill(null);
  let finished = false;

  const questionText = document.getElementById("questionText");
  const options = document.getElementById("options");
  const questionNumber = document.getElementById("questionNumber");
  const progressText = document.getElementById("progressText");
  const answeredText = document.getElementById("answeredText");
  const progressFill = document.getElementById("progressFill");
  const previousBtn = document.getElementById("previousBtn");
  const nextBtn = document.getElementById("nextBtn");

  function loadQuestion() {
    const q = questions[currentQuestion];

    questionNumber.textContent =
      "Question " + (currentQuestion + 1);

    questionText.textContent = q.question;

    progressText.textContent =
      "Question " + (currentQuestion + 1) +
      " of " + questions.length;

    const answered = answers.filter(a => a !== null).length;

    answeredText.textContent =
      answered + " / " + questions.length + " Answered";

    progressFill.style.width =
      ((currentQuestion + 1) / questions.length * 100) + "%";

    options.innerHTML = "";

    q.options.forEach((option, index) => {
      const button = document.createElement("button");

      button.className = "option";
      button.textContent = option;

      if (answers[currentQuestion] === index) {
        button.classList.add("selected");
      }

      button.onclick = function () {
        answers[currentQuestion] = index;

        document.querySelectorAll(".option").forEach(btn => {
          btn.classList.remove("selected");
        });

        button.classList.add("selected");

        updateAnswered();
      };

      options.appendChild(button);
    });

    previousBtn.disabled = currentQuestion === 0;

    nextBtn.textContent =
      currentQuestion === questions.length - 1
        ? "Finish"
        : "Next";
  }

  function updateAnswered() {
    const answered = answers.filter(a => a !== null).length;

    answeredText.textContent =
      answered + " / " + questions.length + " Answered";
  }

  previousBtn.onclick = function () {
    if (currentQuestion > 0) {
      currentQuestion--;
      loadQuestion();
    }
  };

  nextBtn.onclick = function () {
    if (answers[currentQuestion] === null) {
      alert("Please select an answer first.");
      return;
    }

    if (currentQuestion < questions.length - 1) {
      currentQuestion++;
      loadQuestion();
    } else {
      finishQuiz();
    }
  };

  function finishQuiz() {
    finished = true;

    let correct = 0;

    questions.forEach((q, index) => {
      if (answers[index] === q.answer) {
        correct++;
      }
    });

    const incorrect = questions.length - correct;
    const percentage = Math.round(
      (correct / questions.length) * 100
    );

    document.getElementById("quizArea").style.display = "none";
    document.getElementById("result").style.display = "block";

    document.getElementById("score").textContent =
      correct + "/" + questions.length;

    document.getElementById("correctCount").textContent =
      correct;

    document.getElementById("incorrectCount").textContent =
      incorrect;

    document.getElementById("percentage").textContent =
      percentage + "%";

    saveQuizProgress();
    buildReview();
  }

  function buildReview() {
    const reviewContent =
      document.getElementById("reviewContent");

    reviewContent.innerHTML = "";

    questions.forEach((q, index) => {
      const item = document.createElement("div");
      item.className = "review-item";

      const isCorrect =
        answers[index] === q.answer;

      item.innerHTML = `
        <div class="review-question">
          ${index + 1}. ${q.question}
        </div>

        <div class="review-answer ${isCorrect ? "correct" : "incorrect"}">
          Your answer:
          ${answers[index] !== null
            ? q.options[answers[index]]
            : "No answer"}

          <br>

          Correct answer:
          ${q.options[q.answer]}

          <br><br>

          Method: ${q.method}
        </div>
      `;

      reviewContent.appendChild(item);
    });
  }

  function toggleReview() {
    const review = document.getElementById("review");

    review.style.display =
      review.style.display === "block"
        ? "none"
        : "block";
  }

  function retakeQuiz() {
    currentQuestion = 0;
    answers = new Array(questions.length).fill(null);
    finished = false;

    document.getElementById("result").style.display = "none";
    document.getElementById("quizArea").style.display = "block";
    document.getElementById("review").style.display = "none";

    loadQuestion();
  }

  function saveQuizProgress() {
    try {
      const progress =
        JSON.parse(localStorage.getItem("riasStudyHubProgress")) || {
          reviewers: {},
          quizzes: {},
          notes: {}
        };

      if (!progress.quizzes) {
        progress.quizzes = {};
      }

      progress.quizzes["factoring"] = true;

      localStorage.setItem(
        "riasStudyHubProgress",
        JSON.stringify(progress)
      );
    } catch (error) {
      console.error("Could not save quiz progress.", error);
    }
  }

  loadQuestion();
</script>

</body>
</html>
